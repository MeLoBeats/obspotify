server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Fichiers générés par Vite : le nom contient un hash, donc cache longue durée.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html ne doit jamais être mis en cache (sinon OBS garde un ancien build).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
