# Déploiement : docker compose up -d --build
# Prérequis : fichier .env à la racine (DOMAIN=...) et apps/api/.env.production (voir apps/api/.env.example).
#
# Pas de Caddy ici : le serveur en a déjà un (projet ~/apps/caddy) qui tient les ports 80/443.
# Nos services rejoignent son réseau Docker "caddy_net" pour qu'il puisse les joindre,
# sous les noms obspotify-api et obspotify-overlay (voir le Caddyfile de ce dépôt).
services:
  # --- API (Hono) : aucun port publié, uniquement joignable via Caddy
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: apps/api/.env.production
    environment:
      NODE_ENV: production
      PORT: "8000"
      # Base SQLite dans le volume api_data (persistant)
      DB_FILE_NAME: file:/data/db.sqlite
      # Doit être EXACTEMENT déclarée dans le dashboard Spotify (Redirect URIs)
      SPOTIFY_REDIRECT_URI: https://${DOMAIN:?DOMAIN manquant dans .env}/callback
    volumes:
      - api_data:/data
    networks:
      default: {}
      caddy_net:
        # Alias unique : "api" seul pourrait entrer en conflit avec un autre projet du même réseau
        aliases:
          - obspotify-api

  # --- Overlay (fichiers statiques via nginx)
  overlay:
    build: ./apps/overlay
    restart: unless-stopped
    networks:
      default: {}
      caddy_net:
        aliases:
          - obspotify-overlay

networks:
  # Réseau créé par l'autre projet Caddy : on s'y connecte, on ne le crée pas.
  caddy_net:
    external: true

volumes:
  api_data:
